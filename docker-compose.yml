services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: context_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d context_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
